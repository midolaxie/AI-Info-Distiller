name: Daily Finance Report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate report and send
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          # 获取当前日期
          TODAY=$(date +"%Y年%m月%d日")

          # 直接让 DeepSeek 生成一份模拟新闻日报（无需联网或 RSS）
          curl -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-v4-flash",
              "messages": [
                {"role": "system", "content": "你是资深财经新闻主编。请根据你对经济、政治、科技领域的了解，模拟生成一份今日重要新闻简报。要求：按【财经】【政治】【科技】分类，每类至少3条，每条附一句话短评，标题为《今日财经早餐》。内容应贴近近期真实趋势，标注日期。"},
                {"role": "user", "content": "请生成 '"$TODAY"' 的新闻简报"}
              ],
              "max_tokens": 4096
            }' \
            -o response.json

          CONTENT=$(cat response.json | jq -r '.choices[0].message.content // .choices[0].delta.content // ""')
          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            CONTENT="DeepSeek 生成失败，请检查 API Key 或余额。"
          fi

          curl -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"今日财经早餐\",\"content\":\"$CONTENT\"}"
