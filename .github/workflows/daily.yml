name: Daily Finance Report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate report and send
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          curl -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-chat",
              "messages": [
                {"role": "system", "content": "请搜索并整合过去24小时全球财经、政治、科技领域最重要的30-35条新闻。必须按【财经】【政治】【科技】分类，每条用一句话概括核心内容并附短评。以清晰列表格式输出，标题为《今日财经早餐》。尽量覆盖多个不同细分领域，不要只聚焦于单一事件。"},
                {"role": "user", "content": "请生成今日简报"}
              ],
              "enable_search": true,
              "max_tokens": 2048
            }' \
            -o response.json
          CONTENT=$(cat response.json | jq -r '.choices[0].message.content')
          curl -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"今日财经早餐\",\"content\":\"$CONTENT\"}"
