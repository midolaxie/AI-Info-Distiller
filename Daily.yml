name: Daily Finance Report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate report and send
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          curl -X POST https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-v3",
              "messages": [
                {"role": "system", "content": "今天是实时日期。你必须启动联网搜索获取2026年8月23日前后24小时内的真实新闻。严禁编造或使用2025年及以前的旧数据。每条新闻必须附上来源链接（如网址或引用出处）以证明实时性。按【财经】【政治】【科技】分类，每类至少3条，共输出至少10条。格式为纯文本列表，标题《今日财经早餐》。"},
                {"role": "user", "content": "请搜索并生成今日最新财经、政治、科技新闻简报"}
              ],
              "enable_search": true,
              "max_tokens": 4096
            }' \
            -o response.json

          cat response.json
          CONTENT=$(cat response.json | jq -r '.choices[0].message.content')
          curl -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"今日财经早餐\",\"content\":\"$CONTENT\"}"
